name: Update paper monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "18 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-paper-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  update-data:
    needs: test
    if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]')) && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect papers
        timeout-minutes: 16
        run: python -u scripts/collect.py --days 14 --journal-days 60 --max-journal-lookback-days 60 --skip-backfill --skip-high-impact-crossref

      - name: Backfill missing abstracts
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/backfill_abstracts.py --limit 12

      - name: Enrich OA and PubMed full-text figures
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/enrich_media.py --open-access-only --limit 12

      - name: Enrich last-author lab homepages
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/enrich_labs.py --days 14 --limit 4

      - name: Analyze abstracts with DeepSeek
        continue-on-error: true
        timeout-minutes: 6
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_ANALYSIS_LANGUAGE: ${{ vars.DEEPSEEK_ANALYSIS_LANGUAGE }}
        run: python -u scripts/analyze_with_deepseek.py --limit 6 --time-budget 270

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update paper metadata"
          file_pattern: data/papers.json data/backfill_state.json data/source_status.json data/analysis_status.json

  deploy-pages:
    needs:
      - test
      - update-data
    if: ${{ always() && needs.test.result == 'success' && (github.event_name == 'push' || needs.update-data.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
